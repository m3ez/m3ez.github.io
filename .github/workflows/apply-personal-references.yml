name: Apply personal References

on:
  push:
    branches:
      - agent/personalize-references

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portfolio References
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'assets/portfolio-redesign.js';
          let source = fs.readFileSync(path, 'utf8');

          if (!source.includes('const REFERENCE_LINKS = [')) {
            const marker = "];\n\nfunction element(tag, className, text) {";
            const insert = `];\n\nconst REFERENCE_LINKS = [\n  { text: 'GitHub Profile', href: 'https://github.com/m3ez' },\n  { text: 'Medium Articles', href: 'https://m3ez.medium.com/' },\n  { text: 'YouTube', href: 'https://www.youtube.com/@SupakiadS' },\n  { text: 'Wordfence Researcher', href: 'https://www.wordfence.com/threat-intel/vulnerabilities/researchers/supakiad-s' },\n  { text: 'Patchstack Researcher', href: 'https://patchstack.com/database/researchers/d7a606d8-9d89-4bcf-a973-f8ebe721b82f' },\n  { text: 'GitHub Advisory Credits', href: 'https://github.com/advisories?query=credit%3Am3ez' },\n  { text: 'OffSec Credential', href: 'https://credentials.offsec.com/profile/supakiadsatuwan533944/wallet' },\n  { text: 'Accredible Credential', href: 'https://www.credential.net/profile/supakiadsatuwan533944/wallet' },\n  { text: 'Credly Badges', href: 'https://www.credly.com/users/supakiad-satuwan/badges/credly' },\n  { text: 'Portfolio Source', href: 'https://github.com/m3ez/m3ez-security-portfolio' },\n];\n\nfunction element(tag, className, text) {`;
            if (!source.includes(marker)) throw new Error('constant insertion marker not found');
            source = source.replace(marker, insert);
          }

          if (!source.includes('function renderReferences()')) {
            const marker = 'function renderRecognitionItems(container, items) {';
            const insert = `function renderReferences() {\n  const list = document.querySelector('#contact .references .reference-list');\n  if (!list) return;\n\n  list.replaceChildren();\n  for (const item of REFERENCE_LINKS) {\n    const listItem = element('li');\n    const link = element('a', '', item.text);\n    link.href = item.href;\n    link.target = '_blank';\n    link.rel = 'noopener noreferrer';\n    link.setAttribute('aria-label', \`${'${item.text}'} (external link)\`);\n    listItem.appendChild(link);\n    list.appendChild(listItem);\n  }\n}\n\nfunction renderRecognitionItems(container, items) {`;
            if (!source.includes(marker)) throw new Error('renderer insertion marker not found');
            source = source.replace(marker, insert);
          }

          if (!source.includes('  renderReferences();')) {
            const marker = 'function start() {\n  renderHeroProofLinks();\n';
            const insert = 'function start() {\n  renderHeroProofLinks();\n  renderReferences();\n';
            if (!source.includes(marker)) throw new Error('start insertion marker not found');
            source = source.replace(marker, insert);
          }

          fs.writeFileSync(path, source);
          NODE
      - name: Commit implementation
        run: |
          if git diff --quiet -- assets/portfolio-redesign.js; then
            echo "References already patched"
            exit 0
          fi
          git config user.name "Supakiad S. (m3ez)"
          git config user.email "72428471+m3ez@users.noreply.github.com"
          git add assets/portfolio-redesign.js
          git commit -m "feat: personalize References links"
          git push
