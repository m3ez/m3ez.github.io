name: Refresh ambient CVE backdrop

on:
  schedule:
    - cron: '31 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ambient-cve-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout GitHub Pages branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gh-pages

      - name: Refresh locally cached CVE IDs from NVD
        run: node automation/update-recent-cves.mjs

      - name: Commit CVE snapshot only when changed
        id: publish
        run: |
          set -euo pipefail
          git add -- data/recent-cves.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh ambient CVE snapshot'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.publish.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
