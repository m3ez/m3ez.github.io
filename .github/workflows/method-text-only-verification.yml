name: Text-only Method verification
on:
  push:
    branches: [agent/method-text-only]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/agent/method-text-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard production baseline
        run: |
          set -euo pipefail
          git diff --exit-code c052c54fa36db76b308f0de1f57e4bc9248047b2 HEAD -- . ':(exclude).github/workflows/method-text-only-verification.yml'
          mkdir -p /tmp/method-option1-review
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -n 60 /tmp/browser-install.log; exit 1; }
      - name: Stage selected design and its regression tests
        run: |
          python <<'PY'
          import base64,gzip,hashlib,io,tarfile
          from pathlib import Path
          payload = ''
          raw=base64.b64decode(payload)
          assert hashlib.sha256(raw).hexdigest() == '7935c3daee902026e3ddfac154bcb14bd25f6a35e40c751f5ae31eee600600c5'
          stage=Path('/tmp/method-option1-stage'); stage.mkdir()
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(raw))) as archive:
              assert set(archive.getnames()) == {'method.css','tests/method-workflow.test.mjs','tests/browser/method-workflow.test.mjs'}
              archive.extractall(stage,filter='data')
          for path in ['tests/method-workflow.test.mjs','tests/browser/method-workflow.test.mjs']:
              Path(path).write_bytes((stage/path).read_bytes())
          PY
      - name: Prove tests reject the previous boxed design
        run: |
          set +e
          npm test > /tmp/method-option1-review/source-red.log 2>&1
          source_status=$?
          node --test --test-name-pattern='Option 1 is borderless' tests/browser/method-workflow.test.mjs > /tmp/method-option1-review/browser-red.log 2>&1
          browser_status=$?
          set -e
          test "$source_status" = 1
          test "$browser_status" = 1
          grep '^# fail 4$' /tmp/method-option1-review/source-red.log
          grep '^# fail 9$' /tmp/method-option1-review/browser-red.log
      - name: Apply selected Option 1 presentation
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); text=p.read_text()
          old=re.search(r'<section\b[^>]*id="method"[^>]*>.*?</section>',text).group(0)
          count=0
          def inject(match):
              global count
              count+=1
              signal='<span class="method-signal"></span>' if count<8 else ''
              return match[0]+f'<span class="method-track" aria-hidden="true"><span class="method-marker"></span>{signal}</span><span class="method-step" aria-hidden="true">{count:02d}</span>'
          new=re.sub(r'<div class="method-node(?: method-node-final)?" id="method-[^"]+">',inject,old)
          assert count==8
          p.write_text(text.replace(old,new))
          p=Path('assets/research-credentials.css'); text=p.read_text()
          p.write_text(text[:text.index('/* Method:')]+Path('/tmp/method-option1-stage/method.css').read_text())
          PY
      - name: Verify full source and browser suites
        env:
          UI_SCREENSHOTS: /tmp/method-option1-review/screenshots
        run: |
          set -euo pipefail
          git diff --check
          npm test | tee /tmp/method-option1-review/source.log
          npm run test:browser | tee /tmp/method-option1-review/browser.log
      - name: Commit clean tree and verify again
        env:
          UI_SCREENSHOTS: /tmp/method-option1-review/screenshots
        run: |
          set -euo pipefail
          git rm .github/workflows/method-text-only-verification.yml
          git add index.html assets/research-credentials.css tests/method-workflow.test.mjs tests/browser/method-workflow.test.mjs
          test "$(git write-tree)" = 'cc921f348f48bff1e2077891159de964ba68c7e9'
          git -c user.name='m3ez portfolio automation' -c user.email='72428471+m3ez@users.noreply.github.com' commit -m 'Apply Option 1: borderless Method timeline with looping square signals'
          printf 'VERIFIED_COMMIT=%s\nVERIFIED_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee /tmp/method-option1-review/final.txt
          npm test | tee /tmp/method-option1-review/source.log
          npm run test:browser | tee /tmp/method-option1-review/browser.log
          git archive --format=tar HEAD > /tmp/method-option1-review/reviewed-source.tar
          git push origin HEAD:refs/heads/agent/method-text-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: method-option1-review
          path: /tmp/method-option1-review
          if-no-files-found: error
