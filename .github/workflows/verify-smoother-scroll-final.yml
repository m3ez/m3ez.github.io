name: Verify smoother scroll final tree

on:
  push:
    branches:
      - agent/scroll-motion-polish

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 703357c3e92eb950314aade02c7aa1290a264f6a
      - name: Verify exact tested SHA
        run: test "$(git rev-parse HEAD)" = "703357c3e92eb950314aade02c7aa1290a264f6a"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run source tests
        run: npm test
      - name: Run browser tests
        run: npm run test:browser
