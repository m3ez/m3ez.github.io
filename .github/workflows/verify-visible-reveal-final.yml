name: Verify visible reveal final tree

on:
  push:
    branches:
      - agent/scroll-motion-polish

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 93e0ee252542591cef20ffa0b9d0dd77137600bc
      - name: Verify exact tested SHA
        run: test "$(git rev-parse HEAD)" = "93e0ee252542591cef20ffa0b9d0dd77137600bc"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run source tests
        run: npm test
      - name: Run browser tests
        run: npm run test:browser
