name: Update Wordfence CVE ledger

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - gh-pages
    paths:
      - ".github/workflows/update-wordfence-cves.yml"
      - "automation/update-wordfence-cves.mjs"

permissions:
  contents: write
  pages: write

concurrency:
  group: wordfence-cve-update
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: WORDFENCE_API_KEY
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gh-pages

      - name: Update Wordfence CVE inventory
        env:
          WORDFENCE_API_KEY: ${{ secrets.WORDFENCE_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${WORDFENCE_API_KEY:-}" ]; then
            echo "::error::WORDFENCE_API_KEY is not available to this job"
            exit 1
          fi

          feed_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$feed_file" "$headers_file"' EXIT

          http_code="000"
          for attempt in 1 2 3; do
            : > "$headers_file"
            if ! http_code="$(
              curl --silent --show-error --location \
                --connect-timeout 15 \
                --max-time 120 \
                --dump-header "$headers_file" \
                --output "$feed_file" \
                --write-out "%{http_code}" \
                -H "Accept: application/json" \
                -H "Authorization: Bearer $WORDFENCE_API_KEY" \
                "https://www.wordfence.com/api/intelligence/v3/vulnerabilities/production"
            )"; then
              http_code="000"
            fi

            if [ "$http_code" = "200" ]; then
              break
            fi

            if [ "$http_code" = "429" ]; then
              retry_after="$(sed -n 's/^[Rr]etry-[Aa]fter:[[:space:]]*//p' "$headers_file" | tr -d '\r' | tail -n 1)"
              if [ -n "$retry_after" ]; then
                echo "Wordfence rate-limit Retry-After: $retry_after"
              fi

              if [ "$attempt" -eq 1 ] && [[ "$retry_after" =~ ^[0-9]+$ ]] && [ "$retry_after" -gt 0 ] && [ "$retry_after" -le 300 ]; then
                echo "Wordfence feed is rate limited; retrying once after ${retry_after}s"
                sleep "$retry_after"
                continue
              fi

              break
            fi

            case "$http_code" in
              000|408|425|5??)
                if [ "$attempt" -lt 3 ]; then
                  delay=$((attempt * 10))
                  echo "Wordfence feed attempt $attempt returned HTTP $http_code; retrying in ${delay}s"
                  sleep "$delay"
                  continue
                fi
                ;;
            esac

            break
          done

          if [ "$http_code" = "429" ]; then
            node -e '
              const fs = require("node:fs");
              const path = "data/wordfence-cves.json";
              const doc = JSON.parse(fs.readFileSync(path, "utf8"));
              if (!doc || doc.schemaVersion !== 1 || doc.source !== "Wordfence" || !Array.isArray(doc.items) || doc.items.length === 0) {
                throw new Error("Cached Wordfence CVE ledger is invalid");
              }
            '
            echo "::warning::Wordfence returned HTTP 429; retained the existing verified CVE ledger and will retry on the next scheduled run"
            exit 0
          fi

          if [ "$http_code" != "200" ]; then
            echo "::error::Wordfence production feed returned HTTP $http_code"
            exit 1
          fi

          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$feed_file"
          node automation/update-wordfence-cves.mjs \
            --input "$feed_file" \
            --output data/wordfence-cves.json

      - name: Commit changed Wordfence CVE inventory
        run: |
          changed_paths="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //')"
          if [ -z "$changed_paths" ]; then
            exit 0
          fi
          if [ "$changed_paths" != "data/wordfence-cves.json" ]; then
            echo "Unexpected changed paths" >&2
            exit 1
          fi
          if git diff --quiet -- data/wordfence-cves.json; then
            exit 0
          fi
          git add -- data/wordfence-cves.json
          git diff --cached --quiet -- data/wordfence-cves.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Wordfence CVE ledger"
          git push origin HEAD:gh-pages

      - name: Request GitHub Pages rebuild
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
