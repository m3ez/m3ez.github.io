name: Method placement verification
on:
  push:
    branches: [agent/method-text-only]
permissions:
  contents: write
concurrency:
  group: method-placement-review
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/agent/method-text-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard reviewed baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/agent/method-text-only'
          git diff --exit-code 7ce049a85067d62012287b06101937f0aa2d6e15 HEAD -- . ':(exclude).github/workflows/method-border-verification.yml'
          mkdir -p /tmp/method-placement-review
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -n 60 /tmp/browser-install.log; exit 1; }
      - name: Recover digest-verified tests and design
        run: |
          python <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          payload = ''
          raw = base64.b64decode(payload, validate=True)
          assert hashlib.sha256(raw).hexdigest() == '564df09e55d612baa681640b8c42272e867b4e72f1eb7dfb733e36c40ba541e8'
          data = json.loads(gzip.decompress(raw))
          assert set(data) == {'tests', 'apply'}
          Path('/tmp/method-placement-tests.patch').write_text(data['tests'])
          Path('/tmp/method-placement-apply.py').write_text(data['apply'])
          PY
          git apply --check /tmp/method-placement-tests.patch
          git apply /tmp/method-placement-tests.patch
      - name: Prove placement assertions reject the previous layout
        run: |
          set -euo pipefail
          if npm test > /tmp/method-placement-review/source-red.log 2>&1; then
            cat /tmp/method-placement-review/source-red.log; exit 1
          fi
          grep -q '^# fail 1$' /tmp/method-placement-review/source-red.log
          grep -q 'Method must introduce Research' /tmp/method-placement-review/source-red.log
          if node --test --test-name-pattern='Option 1 is borderless, grouped, and readable' tests/browser/method-workflow.test.mjs > /tmp/method-placement-review/browser-red.log 2>&1; then
            cat /tmp/method-placement-review/browser-red.log; exit 1
          fi
          grep -q '^# fail 9$' /tmp/method-placement-review/browser-red.log
          grep -q 'Method must sit directly between hero and Research' /tmp/method-placement-review/browser-red.log
      - name: Apply approved Method placement and compact spacing
        run: python /tmp/method-placement-apply.py
      - name: Full source and browser validation
        env:
          UI_SCREENSHOTS: /tmp/method-placement-review/screenshots
        run: |
          set -euo pipefail
          git diff --check
          npm test | tee /tmp/method-placement-review/source.log
          npm run test:browser | tee /tmp/method-placement-review/browser.log
      - name: Remove temporary workflow and verify final commit
        env:
          UI_SCREENSHOTS: /tmp/method-placement-review/screenshots
        run: |
          set -euo pipefail
          git rm .github/workflows/method-border-verification.yml
          git add index.html assets/research-credentials.css tests/method-workflow.test.mjs tests/browser/method-workflow.test.mjs
          test "$(git write-tree)" = '5c2435055e699bac8d52014ad383e3756f7c7f33'
          git -c user.name='m3ez portfolio automation' -c user.email='72428471+m3ez@users.noreply.github.com' commit -m 'Move borderless Method before Research and compact its responsive spacing'
          printf 'VERIFIED_COMMIT=%s\nVERIFIED_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee /tmp/method-placement-review/final.txt
          npm test | tee /tmp/method-placement-review/source-final.log
          npm run test:browser | tee /tmp/method-placement-review/browser-final.log
          test -z "$(git status --porcelain)"
          git archive --format=tar HEAD > /tmp/method-placement-review/reviewed-source.tar
          git push origin HEAD:refs/heads/agent/method-text-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: method-placement-review
          path: /tmp/method-placement-review
          if-no-files-found: error
