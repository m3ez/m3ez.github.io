name: Verify both icon-only floating controls

on:
  push:
    branches: [agent/icon-only-theme-toggle]
    paths: [.github/workflows/verify-icon-only-controls.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVIDENCE_DIR: /tmp/icon-only-controls-verification
      EXPECTED_TREE: 2eefd3804d20d61cdccb2ddbe4dbbc26790175dc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare only the approved back-to-top styling and regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git merge-base --is-ancestor d520bbca4df2f6f41ac6428e67a0f501133547ef HEAD
          test "$(git rev-parse origin/gh-pages)" = f74b80eb29325cb6b78cb6487a3f050364b55ba3
          git apply --check .github/back-to-top-icon-only.patch
          git apply --index .github/back-to-top-icon-only.patch
          git rm -- .github/back-to-top-icon-only.patch .github/workflows/verify-icon-only-controls.yml
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          printf '%s\n' "$EXPECTED_TREE" > "$EVIDENCE_DIR/tested-tree.txt"
          git diff --cached f74b80eb29325cb6b78cb6487a3f050364b55ba3 --stat | tee "$EVIDENCE_DIR/diff-stat.txt"
          git diff --cached f74b80eb29325cb6b78cb6487a3f050364b55ba3 > "$EVIDENCE_DIR/change.patch"
          git archive --format=tar "$EXPECTED_TREE" > "$EVIDENCE_DIR/reviewed-source.tar"
      - name: Install unchanged pinned browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"
          npx playwright install --with-deps chromium 2>&1 | tee "$EVIDENCE_DIR/browser-install.log"
      - name: Verify all four new cases reject the original boxed back-to-top
        shell: bash
        run: |
          set -euo pipefail
          git show d520bbca4df2f6f41ac6428e67a0f501133547ef:assets/portfolio-interactions.js > assets/portfolio-interactions.js
          set +e
          node --test --test-name-pattern='^icon-only back-to-top' tests/browser/theme-switcher.test.mjs > "$EVIDENCE_DIR/browser-red.log" 2>&1
          red_status=$?
          set -e
          git restore --worktree assets/portfolio-interactions.js
          cat "$EVIDENCE_DIR/browser-red.log"
          test "$red_status" -eq 1
          grep -q '^# fail 4$' "$EVIDENCE_DIR/browser-red.log"
          test "$(grep -c "error: 'back-to-top stays transparent'" "$EVIDENCE_DIR/browser-red.log")" -eq 4
      - name: Run the complete source and unit suite
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$EVIDENCE_DIR/source-final.log"
      - name: Run the complete browser suite over HTTP
        shell: bash
        env:
          UI_SCREENSHOTS: /tmp/icon-only-controls-verification/screenshots
          THEME_SCREENSHOT_DIR: /tmp/icon-only-controls-verification/theme-screenshots
        run: |
          set -euo pipefail
          npm run test:browser 2>&1 | tee "$EVIDENCE_DIR/browser-final.log"
      - name: Publish the verified change only to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
          git restore --source=HEAD --staged --worktree .github/workflows/verify-icon-only-controls.yml
          git config user.name 'Supakiad S. (m3ez)'
          git config user.email '72428471+m3ez@users.noreply.github.com'
          git commit -m 'Match back-to-top to the approved icon-only theme control'
          git push origin HEAD:refs/heads/agent/icon-only-theme-toggle
          git rev-parse HEAD > "$EVIDENCE_DIR/verified-branch-head.txt"
      - name: Retain logs, exact tested source, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-only-controls-verification
          path: |
            /tmp/icon-only-controls-verification
            test-results
          if-no-files-found: error
          retention-days: 14
