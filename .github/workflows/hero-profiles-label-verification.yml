name: Hero profile heading verification
on:
  push:
    branches: [agent/remove-hero-profiles-label]
permissions:
  contents: write
concurrency:
  group: hero-profiles-label-review
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/agent/remove-hero-profiles-label'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard production baseline and recover the previously verified edit scripts
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/agent/remove-hero-profiles-label'
          git diff --exit-code eca9fa6137713cdd00241d1011e642a5e9023222 HEAD -- . ':(exclude).github/workflows/hero-profiles-label-verification.yml'
          mkdir -p /tmp/hero-profiles-label-review
          python <<'PY'
          from pathlib import Path
          import subprocess
          original = subprocess.check_output(['git', 'show', '322f650ffe34bc4a16d83ef7bdc13c4d6f6a7cb5:.github/workflows/hero-profiles-label-verification.yml'], text=True)
          for title, filename in [
              ('Add regression assertions for the requested heading removal', 'hero-tests.sh'),
              ('Remove only the visible heading and its unused style', 'hero-edit.sh'),
          ]:
              marker = '      - name: ' + title + '\n        run: |\n'
              assert original.count(marker) == 1
              lines = original.split(marker, 1)[1].splitlines()
              script = []
              for line in lines:
                  if line and not line.startswith('          '):
                      break
                  script.append(line[10:] if line else '')
              assert script and script[0] == "python <<'PY'"
              Path('/tmp', filename).write_text('\n'.join(script) + '\n')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -n 60 /tmp/browser-install.log; exit 1; }
      - name: Prove the revised assertions reject the existing heading
        run: |
          set -euo pipefail
          bash -euo pipefail /tmp/hero-tests.sh
          if npm test > /tmp/hero-profiles-label-review/source-red.log 2>&1; then
            cat /tmp/hero-profiles-label-review/source-red.log; exit 1
          fi
          grep -q '^# fail 1$' /tmp/hero-profiles-label-review/source-red.log
          grep -q 'remove the heading rather than hiding it' /tmp/hero-profiles-label-review/source-red.log
          if node --test --test-name-pattern='hero prioritizes Research and Contact' tests/browser/layout-readability.test.mjs > /tmp/hero-profiles-label-review/browser-red.log 2>&1; then
            cat /tmp/hero-profiles-label-review/browser-red.log; exit 1
          fi
          grep -q '^# fail 4$' /tmp/hero-profiles-label-review/browser-red.log
          grep -q 'the removed heading must not leave a hidden or empty element' /tmp/hero-profiles-label-review/browser-red.log
      - name: Apply exactly the previously verified product change
        run: |
          set -euo pipefail
          bash -euo pipefail /tmp/hero-edit.sh
          git diff --check
          node --check assets/portfolio-redesign.js
      - name: Full source and browser validation
        env:
          UI_SCREENSHOTS: /tmp/hero-profiles-label-review/screenshots
        run: |
          set -euo pipefail
          npm test | tee /tmp/hero-profiles-label-review/source-green.log
          npm run test:browser | tee /tmp/hero-profiles-label-review/browser-green.log
      - name: Commit the exact tested tree and verify again
        env:
          UI_SCREENSHOTS: /tmp/hero-profiles-label-review/screenshots
        run: |
          set -euo pipefail
          git rm .github/workflows/hero-profiles-label-verification.yml
          git add assets/portfolio-redesign.js assets/research-credentials.css tests/redesign.test.mjs tests/browser/layout-readability.test.mjs
          test "$(git write-tree)" = 'a30f90ba0d5795e58adf0f643042985aa4af9255'
          git diff --cached --check
          git -c user.name='m3ez portfolio automation' -c user.email='72428471+m3ez@users.noreply.github.com' commit -m 'Remove the Profiles & verification heading from the hero'
          printf 'VERIFIED_COMMIT=%s\nVERIFIED_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee /tmp/hero-profiles-label-review/final.txt
          npm test | tee /tmp/hero-profiles-label-review/source-final.log
          npm run test:browser | tee /tmp/hero-profiles-label-review/browser-final.log
      - name: Preserve only the known generated screenshots and publish the review branch
        run: |
          set -euo pipefail
          git status --porcelain | tee /tmp/hero-profiles-label-review/status-before-artifact-move.txt
          python <<'PY'
          from pathlib import Path
          import shutil, subprocess
          generated = Path('test-results')
          assert not subprocess.check_output(['git', 'ls-files', '--', 'test-results'], text=True).strip(), 'never move tracked files'
          assert generated.is_dir() and not generated.is_symlink()
          expected = {'ceh-' + str(width) + '.png' for width in [320,375,640,768,881,1024,1280,1440]}
          assert {p.name for p in generated.iterdir()} == expected, 'unexpected generated files need review'
          for path in generated.iterdir():
              assert path.is_file() and not path.is_symlink()
              assert path.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          shutil.move(str(generated), '/tmp/hero-profiles-label-review/carousel-screenshots')
          PY
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^{tree})" = 'a30f90ba0d5795e58adf0f643042985aa4af9255'
          git diff eca9fa6137713cdd00241d1011e642a5e9023222 HEAD > /tmp/hero-profiles-label-review/change.patch
          git archive --format=tar HEAD > /tmp/hero-profiles-label-review/reviewed-source.tar
          git push origin HEAD:refs/heads/agent/remove-hero-profiles-label
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hero-profiles-label-review
          path: /tmp/hero-profiles-label-review
          if-no-files-found: error
