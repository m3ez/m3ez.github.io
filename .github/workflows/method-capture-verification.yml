name: Method merge readiness
on:
  push:
    branches: [agent/method-workflow]
permissions:
  contents: write
concurrency:
  group: method-merge-readiness
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/agent/method-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard current product tree
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/agent/method-workflow'
          git diff --exit-code 28fd82f26dbc3f8e193221625a4e040f85b8ed91 HEAD -- . ':(exclude).github/workflows/method-capture-verification.yml'
          mkdir -p /tmp/method-merge-review
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -n 60 /tmp/browser-install.log; exit 1; }
      - name: Full source and browser validation
        run: |
          set -euo pipefail
          git diff --check
          npm test | tee /tmp/method-merge-review/source-before.log
          npm run test:browser | tee /tmp/method-merge-review/browser-before.log
      - name: Remove temporary workflow and verify final commit
        run: |
          set -euo pipefail
          git rm .github/workflows/method-capture-verification.yml
          git diff --cached --check
          git -c user.name='m3ez portfolio automation' -c user.email='72428471+m3ez@users.noreply.github.com' commit -m 'Remove temporary Method capture verification workflow'
          git diff --exit-code 28fd82f26dbc3f8e193221625a4e040f85b8ed91 HEAD -- . ':(exclude).github/workflows/method-capture-verification.yml'
          test "$(git diff --name-only 6cfd39d026b21961d0b080c0a69a1c645ab3a5e9 HEAD | wc -l)" -eq 7
          printf 'VERIFIED_COMMIT=%s\nVERIFIED_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee /tmp/method-merge-review/final.txt
          git diff --stat 6cfd39d026b21961d0b080c0a69a1c645ab3a5e9 HEAD | tee /tmp/method-merge-review/diff-stat.txt
          npm test | tee /tmp/method-merge-review/source.log
          npm run test:browser | tee /tmp/method-merge-review/browser.log
          git archive --format=tar HEAD > /tmp/method-merge-review/reviewed-source.tar
          git push origin HEAD:refs/heads/agent/method-workflow
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: method-merge-review
          path: /tmp/method-merge-review
          if-no-files-found: error
