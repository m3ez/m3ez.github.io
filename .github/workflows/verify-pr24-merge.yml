name: Verify PR 24 merge tree

on:
  push:
    branches:
      - agent/scroll-motion-polish

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2e0fe2b437bf08617f697ef29f1015499dceed3
      - name: Verify exact tested SHA
        run: test "$(git rev-parse HEAD)" = "d2e0fe2b437bf08617f697ef29f1015499dceed3"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run source tests
        run: npm test
      - name: Run browser tests
        run: npm run test:browser
