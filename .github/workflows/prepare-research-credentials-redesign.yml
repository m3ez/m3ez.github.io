name: Prepare research and credentials redesign branch

on:
  push:
    branches:
      - agent/research-credentials-redesign

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/research-credentials-redesign

      - name: Verify redesign contracts
        run: node --test tests/redesign.test.mjs

      - name: Enrich CVE data and wire static assets
        run: node automation/prepare-redesign-branch.mjs

      - name: Verify generated branch state
        run: |
          node --test tests/redesign.test.mjs
          node --check assets/certs.js
          node --check assets/research-data.js
          node --check assets/portfolio-redesign.js
          node --check automation/classify-wordfence-cves.mjs
          node --check automation/inject-redesign-assets.mjs
          grep -q '/assets/research-credentials.css' index.html
          grep -q '/assets/portfolio-redesign.js' index.html
          node - <<'NODE'
          const doc = JSON.parse(require('node:fs').readFileSync('data/wordfence-cves.json', 'utf8'));
          if (!doc.stats || !Array.isArray(doc.items) || !doc.items.every((item) =>
            typeof item.severity === 'string' &&
            typeof item.class === 'string' &&
            typeof item.authContext === 'string' &&
            typeof item.unauthenticated === 'boolean' &&
            typeof item.target === 'string' &&
            Number.isInteger(item.year)
          )) throw new Error('CVE classifier contract not satisfied');
          NODE

      - name: Commit generated branch outputs
        run: |
          if git diff --quiet -- index.html data/wordfence-cves.json .github/workflows/update-wordfence-cves.yml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html data/wordfence-cves.json .github/workflows/update-wordfence-cves.yml
          git commit -m "build: prepare research and credentials redesign"
          git push origin HEAD:agent/research-credentials-redesign
