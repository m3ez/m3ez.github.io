name: Hero copy verification
on:
  push:
    branches: [agent/remove-hero-profiles-label]
permissions:
  contents: write
concurrency:
  group: hero-copy-review
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/agent/remove-hero-profiles-label'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard the reviewed PR baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/agent/remove-hero-profiles-label'
          git diff --exit-code bab3755e3f7aae5802ed80acfd0ee13200293502 HEAD -- . ':(exclude).github/workflows/hero-copy-verification.yml'
          mkdir -p /tmp/hero-copy-review
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -n 60 /tmp/browser-install.log; exit 1; }
      - name: Recover the exact reviewed test patch and text replacements
        run: |
          python <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          payload = ''
          raw = base64.b64decode(payload, validate=True)
          assert hashlib.sha256(raw).hexdigest() == '5890dff0df0f2b8e0d63db3ae26813c674bbd5fc9f4f3360c6123cca998389f2'
          data = json.loads(gzip.decompress(raw))
          assert set(data) == {'tests', 'apply'}
          Path('/tmp/hero-copy-tests.patch').write_text(data['tests'])
          Path('/tmp/hero-copy-apply.py').write_text(data['apply'])
          PY
          git apply --check /tmp/hero-copy-tests.patch
          git apply /tmp/hero-copy-tests.patch
          node --check tests/redesign.test.mjs
          node --check tests/browser/layout-readability.test.mjs
      - name: Prove the assertions reject both previous sentences
        run: |
          set -euo pipefail
          if npm test > /tmp/hero-copy-review/source-red.log 2>&1; then
            cat /tmp/hero-copy-review/source-red.log; exit 1
          fi
          grep -q '^# fail 2$' /tmp/hero-copy-review/source-red.log
          grep -q 'hero copy must end after trust boundaries' /tmp/hero-copy-review/source-red.log
          grep -q 'hero introduction must match the requested wording' /tmp/hero-copy-review/source-red.log
          if node --test --test-name-pattern='hero prioritizes Research and Contact|short hero copy remains visible without JavaScript' tests/browser/layout-readability.test.mjs > /tmp/hero-copy-review/browser-red.log 2>&1; then
            cat /tmp/hero-copy-review/browser-red.log; exit 1
          fi
          grep -q '^# fail 6$' /tmp/hero-copy-review/browser-red.log
          grep -q 'hero copy must end after trust boundaries' /tmp/hero-copy-review/browser-red.log
      - name: Apply only the two requested paragraph replacements
        run: python /tmp/hero-copy-apply.py
      - name: Validate the complete source and browser suites
        env:
          UI_SCREENSHOTS: /tmp/hero-copy-review/screenshots
        run: |
          set -euo pipefail
          git diff --check
          npm test | tee /tmp/hero-copy-review/source-green.log
          npm run test:browser | tee /tmp/hero-copy-review/browser-green.log
      - name: Remove the temporary workflow and reverify the final commit
        env:
          UI_SCREENSHOTS: /tmp/hero-copy-review/screenshots
        run: |
          set -euo pipefail
          git rm .github/workflows/hero-copy-verification.yml
          git add index.html tests/redesign.test.mjs tests/browser/layout-readability.test.mjs
          test "$(git write-tree)" = '68d5e0aa817781515d57a3997a095db7cca9a9f4'
          git -c user.name='m3ez portfolio automation' -c user.email='72428471+m3ez@users.noreply.github.com' commit -m 'Shorten both hero sentences to the requested wording'
          printf 'VERIFIED_COMMIT=%s\nVERIFIED_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee /tmp/hero-copy-review/final.txt
          npm test | tee /tmp/hero-copy-review/source-final.log
          npm run test:browser | tee /tmp/hero-copy-review/browser-final.log
      - name: Preserve generated screenshots and publish only the review branch
        run: |
          set -euo pipefail
          python <<'PY'
          import shutil, subprocess
          from pathlib import Path
          screenshots = Path('test-results')
          if screenshots.exists():
              assert not subprocess.check_output(['git', 'ls-files', 'test-results'], text=True).strip()
              expected = {f'ceh-{width}.png' for width in [320,375,640,768,881,1024,1280,1440]}
              assert {p.name for p in screenshots.iterdir()} == expected
              assert all(p.is_file() and p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n') for p in screenshots.iterdir())
              shutil.move(str(screenshots), '/tmp/hero-copy-review/carousel-screenshots')
          PY
          test -z "$(git status --porcelain)"
          git diff bab3755e3f7aae5802ed80acfd0ee13200293502 HEAD > /tmp/hero-copy-review/change.patch
          git archive --format=tar HEAD > /tmp/hero-copy-review/reviewed-source.tar
          test "$(git ls-remote origin refs/heads/agent/remove-hero-profiles-label | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/remove-hero-profiles-label
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hero-copy-review
          path: /tmp/hero-copy-review
          if-no-files-found: error
