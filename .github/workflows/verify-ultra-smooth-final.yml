name: Verify ultra smooth final tree

on:
  push:
    branches:
      - agent/scroll-motion-polish

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c619b05c385870955f0c8546e6f3b923b3ebf4fc
      - name: Verify exact tested SHA
        run: test "$(git rev-parse HEAD)" = "c619b05c385870955f0c8546e6f3b923b3ebf4fc"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run source tests
        run: npm test
      - name: Run browser tests
        run: npm run test:browser
