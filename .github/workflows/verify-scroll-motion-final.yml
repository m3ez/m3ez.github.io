name: Verify scroll motion final tree

on:
  push:
    branches:
      - agent/scroll-motion-polish

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 95b0b1ef87bcee162a1e431b6fd3e74b8e134d4a
      - name: Verify exact tested SHA
        run: test "$(git rev-parse HEAD)" = "95b0b1ef87bcee162a1e431b6fd3e74b8e134d4a"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run source tests
        run: npm test
      - name: Run browser tests
        run: npm run test:browser
