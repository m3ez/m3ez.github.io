name: Verify inertial final tree

on:
  push:
    branches:
      - agent/scroll-motion-polish

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 80218954806d1c5f0ed53c88e48c3b5537fa0f00
      - name: Verify exact tested SHA
        run: test "$(git rev-parse HEAD)" = "80218954806d1c5f0ed53c88e48c3b5537fa0f00"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run source tests
        run: npm test
      - name: Run browser tests
        run: npm run test:browser
