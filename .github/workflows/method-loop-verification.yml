name: Method loop verification
on:
  push:
    branches: [agent/method-workflow]
permissions:
  contents: write
concurrency:
  group: method-loop-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/agent/method-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -n 60 /tmp/browser-install.log; exit 1; }
      - name: Apply requested loop and arrow revision
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text()
          old = '<span class="method-connector" aria-hidden="true"><span class="method-pulse"></span></span>'
          new = '<span class="method-connector" aria-hidden="true"><svg class="method-arrow" viewBox="0 0 32 12" preserveAspectRatio="none" focusable="false"><path class="method-arrow-shaft" d="M3 6H25" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/><path class="method-arrow-head" d="m21 2 7 4-7 4Z" fill="currentColor"/></svg><span class="method-pulse"></span></span>'
          assert html.count(old) == 7
          path.write_text(html.replace(old, new))
          Path('assets/method-workflow.js').write_text('''// Semantic HTML stays readable; the decorative signal loops only while visible.
          export function initializeMethodWorkflow() {
            const workflow = document.querySelector('#method .method-workflow');
            if (!workflow || workflow.dataset.methodInitialized) return;
            workflow.dataset.methodInitialized = 'true';
          
            const steps = [...workflow.children];
            const stepMs = 480;
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            let inView = false;
          
            // Unsupported observers retain the fully drawn static diagram.
            if (steps.length < 2 || typeof IntersectionObserver === 'undefined') {
              workflow.dataset.flowState = 'complete';
              return;
            }
          
            workflow.style.setProperty('--method-cycle', `${steps.length * stepMs}ms`);
            steps.forEach((step, index) => {
              step.style.setProperty('--method-delay', `${index * stepMs}ms`);
            });
          
            function sync() {
              const state = reducedMotion.matches
                ? 'complete'
                : inView && !document.hidden ? 'running' : 'waiting';
              if (workflow.dataset.flowState !== state) workflow.dataset.flowState = state;
            }
          
            // Keep these subscriptions: re-entry and live preference changes may resume
            // the loop. CSS owns the repetition; no interval or completion timer runs.
            const observer = new IntersectionObserver(entries => {
              for (const entry of entries) {
                inView = entry.isIntersecting && entry.intersectionRatio >= 0.2;
                sync();
              }
            }, { threshold: [0, 0.2] });
            reducedMotion.addEventListener?.('change', sync);
            document.addEventListener('visibilitychange', sync);
            observer.observe(workflow);
            sync();
          }
          ''')
          path = Path('assets/research-credentials.css')
          css = path.read_text()
          marker = '/* Method: Mermaid-inspired nodes, with a single sequential signal on the edges. */'
          assert css.count(marker) == 1
          css = css[:css.index(marker)] + '''/* Method: static SVG arrows with a repeating, visibility-gated data signal. */
          #method.method-section{row-gap:1.3rem}
          #method .method-line{color:var(--muted);font:400 13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
          #method .method-workflow{--method-gap:clamp(1.125rem,calc(3vw - 12px),2rem);display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:var(--method-gap);grid-column:1/-1;min-width:0;margin:0;padding:0;list-style:none}
          #method .method-workflow>li{position:relative;min-width:0}
          #method .method-node{position:relative;display:flex;flex-direction:column;gap:.35rem;height:100%;min-height:6.5rem;padding:.75rem .55rem;border:1px solid var(--black);background:var(--paper);color:var(--ink)}
          #method .method-step{color:var(--muted);font:400 10px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
          #method .method-label{font-size:13px;line-height:1.3;font-weight:700}
          #method .method-detail{font-size:12px;line-height:1.4;overflow-wrap:break-word}
          #method .method-connector{position:absolute;left:100%;top:calc(50% - 6px);width:var(--method-gap);height:12px;pointer-events:none}
          #method .method-arrow{position:absolute;left:0;top:0;display:block;width:100%;height:100%;color:var(--muted)}
          #method .method-pulse{position:absolute;left:9.375%;top:50%;width:6px;height:3px;border-radius:1.5px;background:var(--black);transform:translate(-50%,-50%);opacity:0}
          #method .method-workflow[data-flow-state="running"] .method-node{animation:method-node-flow var(--method-cycle) linear infinite;animation-delay:var(--method-delay)}
          #method .method-workflow[data-flow-state="running"] .method-arrow{animation:method-arrow-flow var(--method-cycle) linear infinite;animation-delay:calc(var(--method-delay) + 160ms)}
          #method .method-workflow[data-flow-state="running"] .method-pulse{animation:method-pulse-flow var(--method-cycle) linear infinite;animation-delay:calc(var(--method-delay) + 160ms)}
          @keyframes method-node-flow{0%,10%{background:var(--soft)}20%,100%{background:var(--paper)}}
          @keyframes method-arrow-flow{0%,8.333%{color:var(--black)}12.5%,100%{color:var(--muted)}}
          /* 320ms of travel in the 3840ms eight-stage cycle, after a 160ms node dwell. */
          @keyframes method-pulse-flow{0%{left:9.375%;opacity:0}1%{opacity:1}8%{opacity:1}8.333%{left:78.125%;opacity:0}100%{left:78.125%;opacity:0}}
          @media (max-width:980px){
            #method.method-section{grid-template-columns:1fr;row-gap:.75rem}
            #method .method-workflow{--method-gap:1.5rem;grid-template-columns:1fr;margin-top:.35rem}
            #method .method-node{display:grid;grid-template-columns:1.5rem 5.75rem minmax(0,1fr);gap:.5rem;align-items:center;min-height:3.25rem;padding:.65rem .8rem}
            #method .method-label{font-size:14px}
            #method .method-detail{font-size:13px}
            #method .method-connector{left:calc(50% - 6px);top:100%;width:12px;height:var(--method-gap)}
            #method .method-arrow{left:50%;top:50%;width:var(--method-gap);height:12px;transform:translate(-50%,-50%) rotate(90deg)}
            #method .method-pulse{left:50%;top:9.375%;width:3px;height:6px}
            #method .method-workflow[data-flow-state="running"] .method-pulse{animation-name:method-pulse-flow-vertical}
          }
          @keyframes method-pulse-flow-vertical{0%{top:9.375%;opacity:0}1%{opacity:1}8%{opacity:1}8.333%{top:78.125%;opacity:0}100%{top:78.125%;opacity:0}}
          @media (prefers-reduced-motion:reduce){
            #method .method-workflow .method-node{animation:none!important;background:var(--paper)}
            #method .method-workflow .method-arrow{animation:none!important;color:var(--muted)}
            #method .method-workflow .method-pulse{animation:none!important;opacity:0!important}
          }
          '''
          path.write_text(css)
          path = Path('tests/method-workflow.test.mjs')
          tests = path.read_text()
          assert 'Method arrows use crisp SVG shafts' not in tests
          tests += '''\n\ntest('Method arrows use crisp SVG shafts and filled arrowheads in the static fallback', () => {
            assert.equal((section.match(/class="method-arrow"/g) ?? []).length, 7);
            assert.equal((section.match(/class="method-arrow-shaft"/g) ?? []).length, 7);
            assert.equal((section.match(/class="method-arrow-head"/g) ?? []).length, 7);
            assert.equal((section.match(/vector-effect="non-scaling-stroke"/g) ?? []).length, 7);
          });
          '''
          path.write_text(tests)
          PY
      - name: Source suite
        run: npm test > /tmp/method-loop-source.log 2>&1 && tail -n 12 /tmp/method-loop-source.log || { cat /tmp/method-loop-source.log; exit 1; }
      - name: Browser suite
        env:
          UI_SCREENSHOTS: /tmp/method-loop-review
        run: npm run test:browser > /tmp/method-loop-browser.log 2>&1 && tail -n 12 /tmp/method-loop-browser.log || { cat /tmp/method-loop-browser.log; exit 1; }
      - name: Commit and reverify the clean review tree
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/agent/method-workflow'
          git rm .github/workflows/method-loop-verification.yml
          git add index.html assets/method-workflow.js assets/research-credentials.css tests/method-workflow.test.mjs
          git diff --cached --check
          git -c user.name='m3ez portfolio automation' -c user.email='72428471+m3ez@users.noreply.github.com' commit -m 'Loop Method data flow and refine SVG arrow connectors'
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)" | tee /tmp/method-loop-final.txt
          echo "VERIFIED_TREE=$(git rev-parse HEAD^{tree})" | tee -a /tmp/method-loop-final.txt
          git diff --stat 649485c8655c3bd6e7abdf454f30cc888a9d5e04 HEAD | tee -a /tmp/method-loop-final.txt
          test "$(git diff --name-only 649485c8655c3bd6e7abdf454f30cc888a9d5e04 HEAD | wc -l)" -eq 5
          git diff --check 649485c8655c3bd6e7abdf454f30cc888a9d5e04 HEAD
          npm test > /tmp/method-loop-source.log 2>&1 || { cat /tmp/method-loop-source.log; exit 1; }
          UI_SCREENSHOTS=/tmp/method-loop-review npm run test:browser > /tmp/method-loop-browser.log 2>&1 || { cat /tmp/method-loop-browser.log; exit 1; }
          tail -n 12 /tmp/method-loop-source.log
          tail -n 12 /tmp/method-loop-browser.log
          git archive --format=tar HEAD > /tmp/method-loop-reviewed-source.tar
          git push origin HEAD:refs/heads/agent/method-workflow
      - name: Record actual looping preview
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/method-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { mkdir } from 'node:fs/promises';
          await mkdir('/tmp/method-loop-review/video', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 480 }, reducedMotion: 'no-preference', recordVideo: { dir: '/tmp/method-loop-review/video', size: { width: 1440, height: 480 } } });
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:8765', { waitUntil: 'networkidle' });
          await page.locator('#method').evaluate(node => node.scrollIntoView({ behavior: 'instant', block: 'center' }));
          await page.waitForFunction(() => document.querySelector('.method-workflow').dataset.flowState === 'running');
          await page.waitForTimeout(9000);
          const video = page.video();
          await context.close();
          await video.saveAs('/tmp/method-loop-review/method-loop.webm');
          await browser.close();
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: method-loop-review
          path: |
            /tmp/method-loop-review/*.png
            /tmp/method-loop-review/method-loop.webm
            /tmp/method-loop-source.log
            /tmp/method-loop-browser.log
            /tmp/method-loop-final.txt
            /tmp/method-loop-reviewed-source.tar
          if-no-files-found: ignore
