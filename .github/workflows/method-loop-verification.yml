name: Method loop verification
on:
  push:
    branches: [agent/method-workflow]
permissions:
  contents: read
concurrency:
  group: method-loop-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/agent/method-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -n 60 /tmp/browser-install.log; exit 1; }
      - name: Existing source tests
        run: npm test
      - name: Revised Method expectations
        run: node --test tests/browser/method-workflow.test.mjs
