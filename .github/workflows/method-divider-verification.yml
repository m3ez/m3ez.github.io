name: Method divider verification
on:
  push:
    branches: [agent/method-text-only]
permissions:
  contents: write
concurrency:
  group: method-divider-review
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/agent/method-text-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard reviewed baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/agent/method-text-only'
          git diff --exit-code 12e0b08c060b9d90768891a3d0b4cea4b4f06fb2 HEAD -- . ':(exclude).github/workflows/method-divider-verification.yml'
          mkdir -p /tmp/method-divider-review
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -n 60 /tmp/browser-install.log; exit 1; }
      - name: Add divider regression assertions
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('tests/method-workflow.test.mjs')
          s = p.read_text()
          s += r'''

          test('Method ends with one shared-theme divider without adding a card frame', () => {
            assert.match(methodCss, /#method\.method-section\{[^}]*border:0;[^}]*border-bottom:1px solid var\(--line\)/,
              'Method needs a single bottom divider in the shared line color');
            assert.match(methodCss, /#method \+ #research\{[^}]*border-top:0/,
              'Research must not duplicate the Method divider on mobile');
          });
          '''
          p.write_text(s)
          p = Path('tests/browser/method-workflow.test.mjs')
          s = p.read_text()
          old = "      borders: ['Top', 'Right', 'Bottom', 'Left'].map(side => style[`border${side}Width`]),\n      padding: [style.paddingLeft, style.paddingRight],"
          new = """      borders: ['Top', 'Right', 'Bottom', 'Left'].map(side => style[`border${side}Width`]),
                dividerStyle: style.borderBottomStyle, dividerColor: style.borderBottomColor,
                researchBorderTop: getComputedStyle(document.getElementById('research')).borderTopWidth,
                feedback: box('#method .method-feedback-label'),
                padding: [style.paddingLeft, style.paddingRight],"""
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = "  assert.deepEqual(layout.borders, ['0px', '0px', '0px', '0px']);"
          new = """  assert.deepEqual(layout.borders, ['0px', '0px', '1px', '0px'],
              'Method has one bottom divider, not an outer card frame');
            assert.equal(layout.dividerStyle, 'solid');
            assert.equal(layout.dividerColor, (await sitePalette(page)).line);
            assert.equal(layout.researchBorderTop, '0px', 'Research must not double the divider');
            assert.ok(layout.feedback.bottom < layout.method.bottom - 1,
              'the divider must remain below the feedback path and caption');"""
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
      - name: Prove assertions reject the missing divider
        run: |
          set -euo pipefail
          if npm test > /tmp/method-divider-review/source-red.log 2>&1; then
            cat /tmp/method-divider-review/source-red.log; exit 1
          fi
          grep -q '^# fail 1$' /tmp/method-divider-review/source-red.log
          grep -q 'Method needs a single bottom divider' /tmp/method-divider-review/source-red.log
          if node --test --test-name-pattern='Option 1 is borderless, grouped, and readable' tests/browser/method-workflow.test.mjs > /tmp/method-divider-review/browser-red.log 2>&1; then
            cat /tmp/method-divider-review/browser-red.log; exit 1
          fi
          grep -q '^# fail 9$' /tmp/method-divider-review/browser-red.log
          grep -q 'Method has one bottom divider' /tmp/method-divider-review/browser-red.log
      - name: Add the single divider without restoring card borders
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('assets/research-credentials.css')
          s = p.read_text()
          old = 'row-gap:1rem;border:0;background:var(--method-bg)'
          new = 'row-gap:1rem;border:0;border-bottom:1px solid var(--line);background:var(--method-bg)'
          assert s.count(old) == 1
          s = s.replace(old,new)
          old = '#method + #research{padding-top:clamp(1.5rem,3vw,2rem)}'
          new = '#method + #research{padding-top:clamp(1.5rem,3vw,2rem);border-top:0}'
          assert s.count(old) == 1
          p.write_text(s.replace(old,new))
          PY
      - name: Full source and browser validation
        env:
          UI_SCREENSHOTS: /tmp/method-divider-review/screenshots
        run: |
          set -euo pipefail
          git diff --check
          node --check tests/method-workflow.test.mjs
          node --check tests/browser/method-workflow.test.mjs
          npm test | tee /tmp/method-divider-review/source.log
          npm run test:browser | tee /tmp/method-divider-review/browser.log
      - name: Remove temporary workflow and verify exact final commit
        env:
          UI_SCREENSHOTS: /tmp/method-divider-review/screenshots
        run: |
          set -euo pipefail
          git rm .github/workflows/method-divider-verification.yml
          git add assets/research-credentials.css tests/method-workflow.test.mjs tests/browser/method-workflow.test.mjs
          test "$(git write-tree)" = '10c4be495d41047afdfceda9f9d1ae0ed40c1ea9'
          git -c user.name='m3ez portfolio automation' -c user.email='72428471+m3ez@users.noreply.github.com' commit -m 'Add one horizontal divider after Method without a card frame'
          printf 'VERIFIED_COMMIT=%s\nVERIFIED_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee /tmp/method-divider-review/final.txt
          npm test | tee /tmp/method-divider-review/source-final.log
          npm run test:browser | tee /tmp/method-divider-review/browser-final.log
          test -z "$(git status --porcelain)"
          git archive --format=tar HEAD > /tmp/method-divider-review/reviewed-source.tar
          git push origin HEAD:refs/heads/agent/method-text-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: method-divider-review
          path: /tmp/method-divider-review
          if-no-files-found: error
