name: Mirror to GitLab Pages

on:
  push:
    branches:
      - gh-pages

  workflow_run:
    workflows:
      - "Update Wordfence CVE ledger"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitlab-pages
  cancel-in-progress: true

jobs:
  mirror:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "::error::GITLAB_TOKEN is not configured"
            exit 1
          fi

          git remote add gitlab \
            "https://m3ez:${GITLAB_TOKEN}@gitlab.com/m3ez/m3ez.gitlab.io.git"

          git push --force gitlab HEAD:main
