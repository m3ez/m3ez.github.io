name: Method integrated merge verification
on:
  push:
    branches: [agent/method-workflow]
permissions:
  contents: write
concurrency:
  group: method-integrated-merge-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/agent/method-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard reviewed head and integrate current production
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/agent/method-workflow'
          git diff --exit-code 1d41a160752939ffca923effa9a5259e417a92b6 HEAD -- . ':(exclude).github/workflows/method-merge-verification.yml'
          mkdir -p /tmp/method-integrated-review
          git config user.name 'm3ez portfolio automation'
          git config user.email '72428471+m3ez@users.noreply.github.com'
          git merge --no-commit --no-ff 16073908efbd7b18e58dc836358af770f7b35c3c
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -n 60 /tmp/browser-install.log; exit 1; }
      - name: Validate combined changes before committing
        run: |
          set -euo pipefail
          git diff --check
          git diff --cached --check
          npm test | tee /tmp/method-integrated-review/source-before.log
          npm run test:browser | tee /tmp/method-integrated-review/browser-before.log
      - name: Commit integration and reverify exact clean tree
        run: |
          set -euo pipefail
          git commit -m 'Merge current credential descriptions into Method review branch'
          git rm .github/workflows/method-merge-verification.yml
          git commit -m 'Remove temporary Method integration verification workflow'
          git merge-base --is-ancestor 16073908efbd7b18e58dc836358af770f7b35c3c HEAD
          test "$(git diff --name-only 16073908efbd7b18e58dc836358af770f7b35c3c HEAD | wc -l)" -eq 7
          printf 'VERIFIED_COMMIT=%s\nVERIFIED_TREE=%s\nVERIFIED_BASE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" '16073908efbd7b18e58dc836358af770f7b35c3c' | tee /tmp/method-integrated-review/final.txt
          git diff --stat 16073908efbd7b18e58dc836358af770f7b35c3c HEAD | tee /tmp/method-integrated-review/diff-stat.txt
          npm test | tee /tmp/method-integrated-review/source.log
          npm run test:browser | tee /tmp/method-integrated-review/browser.log
          git archive --format=tar HEAD > /tmp/method-integrated-review/reviewed-source.tar
          git push origin HEAD:refs/heads/agent/method-workflow
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: method-integrated-review
          path: /tmp/method-integrated-review
          if-no-files-found: error
