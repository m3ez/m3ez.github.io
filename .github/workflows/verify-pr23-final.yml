name: Verify PR 23 exact tree

on:
  push:
    branches:
      - agent/add-medium-hero-link

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 959736c13b88c372d75bb63bd41fa8d58286c381
      - name: Verify exact tested SHA
        run: test "$(git rev-parse HEAD)" = "959736c13b88c372d75bb63bd41fa8d58286c381"
      - name: Run full portfolio suite
        run: node --test tests/*.test.mjs
